<!-- <app-nested-sections /> -->
<section class="section-book">
    <div class="row">
        <div class="book">
            <div class="book__form">
                <div class="center-header u-header-marginn-5">
                    <h2 class="header-teritory"> Login to Continue</h2>
                </div>
                <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
                    <div class="form__group">
                        <input formControlName="userName" type="text" class="form__input" id="name" name="name" placeholder="Enter User Name" required>
                        <label class="form__label" for="name">Enter User Name</label>
                    </div>
                    <div class="form__group">
                        <input formControlName="password" type="password" class="form__input" id="password" name="password" placeholder="Enter Password"
                            required>
                        <label class="form__label" for="email">Enter Password</label>
                    </div>
                    <button type="submit" #loginButton > {{ loginApiCallProgress() ? 'Loading...' : 'Login'}}</button>
                </form>

            </div>
        </div>
    </div>
</section>
