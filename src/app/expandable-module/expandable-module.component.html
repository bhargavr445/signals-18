<div class="module">
  <!-- Toggle button -->
  <button (click)="toggleExpand()">
    {{ expanded ? '▼' : '▶' }} {{ module?.label }}
  </button>
  <input type="checkbox" name="" id="">


  <!-- Show nested modules if expanded -->
  @if (expanded) {
    <div class="nested">
      @for (subModule of module.modules; track subModule) {
        <div>
          <app-expandable-module [module]="subModule"></app-expandable-module>
        </div>
      }
    </div>
  }
</div>
