<fepoc-modal 
    [header]="$safeNavigationMigration(modalContent()?.headerLabel)"
    [content]="$safeNavigationMigration(modalContent()?.content)"
    [primarybutton]="$safeNavigationMigration(modalContent()?.primaryButton)"
    [secondarybutton]="$safeNavigationMigration(modalContent()?.secondaryButton)"
    [open]="$safeNavigationMigration(modalContent()?.toggleStatus)" 
    (closeType)="handleCloseType($event)">
</fepoc-modal>
