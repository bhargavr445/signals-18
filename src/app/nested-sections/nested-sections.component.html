<div class="container">
  <!-- Loop through main sections (prr, vendorReports) -->
  @for (key of keys; track key) {
    <div>
      <div class="section">
        <!-- Toggle button -->
        <button (click)="toggleSection(key)">
          {{ expandedSections[key] ? '▼' : '▶' }} {{ data[key].label }}
        </button>
        <input type="checkbox" [(ngModel)]="data[key].toggleProp">
        <!-- Show nested modules if expanded -->
        @if (expandedSections[key]) {
          <div class="nested">
            @for (module of data[key].modules; track module) {
              <div>
                <app-expandable-module [module]="module"></app-expandable-module>
              </div>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
