<form>
        <div class="form-row">
        <div class="form-group">
            @let course_id_control = courseForm.courseId;
            <u-label [for]="'course_id'">
                Course ID
            </u-label>
            <input type="text" [control]="courseForm.courseId" id="course_id" placeholder="Enter Course ID">
            <!-- {{course_id_control().errors() | json}} -->
           
            <div class="validation-msg">
                @for (item of course_id_control().errors(); track item.kind) {
                        {{item.message}}
                }
            </div>
            

            <!-- @if(!course_id_control.valid && course_id_control.hasError('exist')) {
            <div class="validation-msg">
                This ID already exist.
            </div>
            } -->

        </div>
        <div class="form-group">
            <u-label [for]="'title'">Title</u-label>
            <input type="text" id="title" [control]="courseForm.title" placeholder="Enter title">
        </div>
        <div class="form-group">
            @let price_control = courseForm.price;
            <u-label [for]="'price'">Price--{{doubledPrice()}}</u-label>
            <input type="number" id="price" [control]="price_control" placeholder="Enter price">
            <div class="validation-msg">
                @for (item of price_control().errors(); track item.kind) {
                        {{item.message}}
                }
            </div>
        </div>
    </div>
   
</form>
 <button type="submit" (click)="submit()">Submit</button>
