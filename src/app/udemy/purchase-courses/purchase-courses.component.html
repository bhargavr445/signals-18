<table>
    <thead>
        <tr>
            <th>Title</th>
        <th>Price</th>
        <th>Type</th>
        </tr>
        
    </thead>

    <tbody>
        @for (item of paginatedRecords(); track $index) {
            <tr>
            <td>{{item.title}}</td>
            <td>{{item.price | currency}}</td>
            <td [class]="`${categoryClassMap[item.categoryDetails.type] } cat`">{{item.categoryDetails.type}}</td>
         
        </tr>
        }
        
    </tbody>
</table>
@if (coursesList().length) {
    <div class="pagination-bar">
        <gbr-pagination
            [datalist]="coursesList()" 
            [pagesize]="10"
            (paginatedlisthandler)="handlePaginatedList($event)" />
    </div>
}
